# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '34 23 * * 0'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: kirchDev/workflows/.github/workflows/_codeql.yml@4749430b355865343a7f70c111eeeb2e1f3e430b # v0.10.0
