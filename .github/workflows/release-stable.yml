# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Stable channel. The installers and the updater manifest for a release
# release-please has already published — release-please cuts the tag, the
# changelog and the release page, and this builds what people actually download.
#
# WHY THIS FILE EXISTS AS A FILE. It used to be two jobs inside
# `release-please.yml`. Moving that stub onto the central body in
# `kirchDev/workflows` (d1da865) dropped them, and v0.13.0 shipped with an empty
# assets list and no `latest.json` — which also breaks the live updater, since
# `releases/latest/download/latest.json` resolves to the newest stable release.
# Standing on its own, the build survives the next time the stub is rewritten,
# and gains the dispatch entry point that repairs a release like that one.
#
# TWO ENTRY POINTS:
#   • workflow_call  — `release-please.yml` calls it when a release was cut.
#     Source is the ref that triggered the run: the release commit on main.
#   • workflow_dispatch — rebuild a tag that already shipped. Source is the tag
#     itself, so the binaries match what the release page says they are.
#
# Stable is Windows + Linux. macOS compiles in CI but is untested and unsigned,
# so it is not offered as a download here; beta builds all three.

name: Release Stable

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release the installers belong to, e.g. `v0.13.0`.
        required: true
        type: string
    secrets:
      BWS_ACCESS_TOKEN:
        description: Bitwarden Secrets Manager access token — opens the updater signing key.
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build installers for, e.g. `v0.13.0`.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-stable-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the target release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.target.outputs.version }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      # A dispatch is a repair, and a repair that quietly CREATES a release is
      # worse than one that fails: tauri-action makes a release when the tag it
      # is handed has none, so a typo would publish an empty stray. Fail here
      # instead, before anything is built.
      - name: Check the release exists and derive the version
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no release found for tag $TAG — release-please publishes it first"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # On a call the triggering ref IS the release commit, and an empty ref
          # lets the build reuse the checkout cache for it. A dispatch runs from
          # the default branch, whose HEAD has moved on, so it must name the tag.
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Stable build
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/_tauri-build.yml
    with:
      matrix: '{"os": ["ubuntu-latest", "windows-latest"]}'
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ inputs.tag }}
      ref: ${{ needs.prepare.outputs.ref }}
      prerelease: false
      job-name: Stable build
      matrix-label: os
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  finalize:
    name: Publish updater manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Assembled once, here, rather than by each matrix leg: the legs run in
      # parallel and `uploadUpdaterJson` has them all write the same manifest,
      # so the last writer wins and the other platform disappears from it.
      - name: Build latest.json and attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ver = process.env.VERSION;
          const base = process.env.BASE;
          const files = fs.readdirSync('sigs').filter((f) => f.endsWith('.sig'));
          const find = (re) => files.find((f) => re.test(f));
          const entry = (sig) => ({
            signature: fs.readFileSync(path.join('sigs', sig), 'utf8').trim(),
            url: `${base}/${sig.replace(/\.sig$/, '')}`
          });
          const win = find(/_x64-setup\.exe\.sig$/);
          const lin = find(/_amd64\.AppImage\.sig$/);
          if (!win || !lin) {
            console.error('::error::missing platform sig — win:%s lin:%s', !!win, !!lin);
            process.exit(1);
          }
          const platforms = {
            'windows-x86_64': entry(win),
            'windows-x86_64-nsis': entry(win),
            'linux-x86_64': entry(lin),
            'linux-x86_64-appimage': entry(lin)
          };
          const out = { version: ver, notes: `Release ${ver}.`, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync('latest.json', JSON.stringify(out, null, 2));
          console.log('latest.json platforms:', Object.keys(platforms).join(', '));
          NODE
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
