# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Beta channel: manually dispatched build that publishes to a single, rolling
# `beta` GitHub release. The in-app updater (beta channel) reads
# `releases/download/beta/latest.json`. Stable stays on release-please.
#
# Pick a semver-ordered version, e.g. 0.1.0-beta.1 → 0.1.0-beta.2 → … so the
# updater offers newer betas; a later stable 0.1.0 supersedes them all.
#
# Two-phase to keep the rolling release clean and the updater manifest correct:
#   1. `prepare` wipes and recreates the `beta` release + tag at the current
#      commit (no stale assets, fresh body/commit), and exports its id.
#   2. `build` runs the OS matrix SERIALLY (max-parallel: 1) and uploads to that
#      release. tauri-action merges each platform into the existing latest.json,
#      so running serially (not in parallel) avoids the read-modify-write race
#      that previously left latest.json with only one platform.
#
# Requires the same signing secrets as the stable bundle job
# (see UPDATER-SETUP.local.md).

name: Release Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version (e.g. 0.1.0-beta.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  prepare:
    name: Reset rolling beta release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      # Wipe the previous rolling beta (release + tag + all accumulated assets)
      # so each dispatch starts from a clean release with only this version's
      # artifacts and an up-to-date target commit.
      - name: Recreate the beta release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create beta \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Beta' \
            --notes "Rolling beta channel build ${{ inputs.version }}." \
            --prerelease
          id=$(gh release view beta --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Beta build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Serial: tauri-action merges each platform into the release's latest.json,
      # so parallel jobs race and lose entries. One at a time → all platforms.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Updater signing key + password live in Bitwarden SM (same flow as the
      # Release App PEM). Fetched into env for the build step below.
      - name: Fetch updater signing secrets from Bitwarden
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            2fc619e7-4c67-4f40-9a63-b45b017af6d9 > TAURI_SIGNING_PRIVATE_KEY
            1fb62037-259b-45ec-b0fa-b45b017ab6e7 > TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      # tauri-action reads the version from tauri.conf.json; stamp the beta one.
      - name: Stamp beta version
        shell: bash
        run: |
          tmp=$(mktemp)
          jq --arg v "${{ inputs.version }}" '.version = $v' \
            src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

      # Builds + signs and uploads installers to the prepared release, merging
      # this platform into latest.json. No release creation here — `prepare` owns
      # the release; `releaseId` targets it.
      - name: Build and upload beta
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: true
