# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Beta channel: manually dispatched build that publishes to a single, rolling
# `beta` GitHub release. The in-app updater (beta channel) reads
# `releases/download/beta/latest.json`. Stable stays on release-please.
#
# Pick a semver-ordered version, e.g. 0.1.0-beta.1 → 0.1.0-beta.2 → … so the
# updater offers newer betas; a later stable 0.1.0 supersedes them all.
#
# Requires the same signing secrets as the stable bundle job
# (see UPDATER-SETUP.local.md).

name: Release Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version (e.g. 0.1.0-beta.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  beta:
    name: Beta build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action reads the version from tauri.conf.json; stamp the beta one.
      - name: Stamp beta version
        shell: bash
        run: |
          tmp=$(mktemp)
          jq --arg v "${{ inputs.version }}" '.version = $v' \
            src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

      # Builds + signs and (re)publishes the rolling `beta` release with
      # installers + latest.json. Marked as a prerelease.
      - name: Build and upload beta
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: beta
          releaseName: 'Beta'
          releaseBody: 'Rolling beta channel build ${{ inputs.version }}.'
          prerelease: true
          includeUpdaterJson: true
