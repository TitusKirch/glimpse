# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Beta channel. Manually dispatched. Two release surfaces:
#   • a VERSIONED prerelease `v<version>` holds the real installers + .sig
#     (proper per-beta history and download page), and
#   • a static rolling `beta` release holds ONLY `latest.json`, the stable
#     updater endpoint (`releases/download/beta/latest.json`).
# latest.json's URLs point at the versioned prerelease's assets — direct tag
# download URLs work for prereleases, unlike the `releases/latest` alias which
# skips them. Stable releases stay on release-please.
#
# Pick a semver-ordered version, e.g. 0.1.0-beta.1 → 0.1.0-beta.2 → …
#
# Phases:
#   1. prepare  — (re)create the versioned `v<version>` prerelease at this commit.
#   2. build    — OS matrix in parallel, uploads installers + .sig to it.
#   3. finalize — assemble one latest.json (URLs → the versioned prerelease) and
#      republish the static `beta` release holding only that manifest.
#
# Requires the same signing secrets as the stable bundle job
# (see UPDATER-SETUP.local.md).

name: Release Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version (e.g. 0.1.0-beta.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  prepare:
    name: Create versioned prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - name: Recreate v<version> prerelease
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Beta build $VERSION." \
            --prerelease
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Beta build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Updater signing key + password live in Bitwarden SM (same flow as the
      # Release App PEM). Fetched into env for the build step below.
      - name: Fetch updater signing secrets from Bitwarden
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            2fc619e7-4c67-4f40-9a63-b45b017af6d9 > TAURI_SIGNING_PRIVATE_KEY
            1fb62037-259b-45ec-b0fa-b45b017ab6e7 > TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      # tauri-action reads the version from tauri.conf.json; stamp the beta one.
      - name: Stamp beta version
        shell: bash
        run: |
          tmp=$(mktemp)
          jq --arg v "${{ inputs.version }}" '.version = $v' \
            src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

      # Builds + signs and uploads the installers + their .sig to the versioned
      # prerelease. No latest.json here (finalize builds it once) → parallel jobs
      # only upload distinct files, so there is no race.
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false

  finalize:
    name: Publish updater manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build latest.json and republish the static beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ver = process.env.VERSION;
          const base = process.env.BASE;
          const files = fs.readdirSync('sigs').filter((f) => f.endsWith('.sig'));
          const find = (re) => files.find((f) => re.test(f));
          const entry = (sig) => ({
            signature: fs.readFileSync(path.join('sigs', sig), 'utf8').trim(),
            url: `${base}/${sig.replace(/\.sig$/, '')}`
          });
          const win = find(/_x64-setup\.exe\.sig$/);
          const lin = find(/_amd64\.AppImage\.sig$/);
          const mac = find(/\.app\.tar\.gz\.sig$/);
          if (!win || !lin || !mac) {
            console.error('missing platform sig — win:%s lin:%s mac:%s', !!win, !!lin, !!mac);
            process.exit(1);
          }
          const platforms = {
            'windows-x86_64': entry(win),
            'windows-x86_64-nsis': entry(win),
            'linux-x86_64': entry(lin),
            'linux-x86_64-appimage': entry(lin),
            'darwin-aarch64': entry(mac),
            'darwin-aarch64-app': entry(mac)
          };
          const out = { version: ver, notes: `Beta build ${ver}.`, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync('latest.json', JSON.stringify(out, null, 2));
          console.log('latest.json platforms:', Object.keys(platforms).join(', '));
          NODE
          # The static `beta` release holds ONLY latest.json — recreate it clean
          # each time so no stale installers linger and the manifest is current.
          gh release delete beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create beta \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Beta (updater manifest)' \
            --notes "Holds latest.json for the beta auto-updater. Installers live in the versioned \`$TAG\` prerelease." \
            --prerelease
          gh release upload beta latest.json --repo "$GITHUB_REPOSITORY" --clobber
