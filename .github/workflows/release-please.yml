# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Run release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Fetch Release App PEM from Bitwarden
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            29f8317d-29f7-46af-834b-b4550012d477 > KIRCHDEV_RELEASE_APP_PEM

      - name: Mint Release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: 'Iv23li3hNqtsZ8fDlwqH'
          private-key: ${{ env.KIRCHDEV_RELEASE_APP_PEM }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When release-please cuts a release, build the native installers and attach
  # them to it (ubuntu + windows matrix). Mirrors the meta-layer convention of
  # gating real work on `release_created`.
  bundle:
    name: Bundle installers (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Updater signing key + password live in Bitwarden SM (same flow as the
      # Release App PEM). Fetched into env for the build step below.
      - name: Fetch updater signing secrets from Bitwarden
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            2fc619e7-4c67-4f40-9a63-b45b017af6d9 > TAURI_SIGNING_PRIVATE_KEY
            1fb62037-259b-45ec-b0fa-b45b017ab6e7 > TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      # Authenticode-sign the Windows .exe + NSIS installer via Azure Artifact
      # Signing. Injects bundle.windows.signCommand before the build runs — see
      # WINDOWS-SIGNING-SETUP.local.md.
      - name: Set up Windows code signing (Azure Artifact Signing)
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-codesigning
        with:
          bws-access-token: ${{ secrets.BWS_ACCESS_TOKEN }}

      # Builds NSIS (Windows) and AppImage + .deb (Linux), signs the updater
      # artifacts, and uploads them to the release-please release. No latest.json
      # here: the `finalize` job assembles it once. The matrix runs in parallel,
      # and per-job includeUpdaterJson races on the shared manifest (last writer
      # wins, dropping platforms). Requires the signing secrets to be set — see
      # UPDATER-SETUP.local.md for the one-time key generation + secrets.
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          includeUpdaterJson: false

  # Assemble latest.json once, from the sigs the parallel bundle jobs uploaded,
  # and attach it to the release — the race-free pattern the beta workflow uses.
  # Stable ships Windows + Linux (no macOS), so the manifest has those keys.
  finalize:
    name: Publish updater manifest
    needs: [release-please, bundle]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build latest.json and attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VER="${TAG#v}"
          mkdir -p sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          VER="$VER" BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ver = process.env.VER;
          const base = process.env.BASE;
          const files = fs.readdirSync('sigs').filter((f) => f.endsWith('.sig'));
          const find = (re) => files.find((f) => re.test(f));
          const entry = (sig) => ({
            signature: fs.readFileSync(path.join('sigs', sig), 'utf8').trim(),
            url: `${base}/${sig.replace(/\.sig$/, '')}`
          });
          const win = find(/_x64-setup\.exe\.sig$/);
          const lin = find(/_amd64\.AppImage\.sig$/);
          if (!win || !lin) {
            console.error('::error::missing platform sig — win:%s lin:%s', !!win, !!lin);
            process.exit(1);
          }
          const platforms = {
            'windows-x86_64': entry(win),
            'windows-x86_64-nsis': entry(win),
            'linux-x86_64': entry(lin),
            'linux-x86_64-appimage': entry(lin)
          };
          const out = { version: ver, notes: `Release ${ver}.`, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync('latest.json', JSON.stringify(out, null, 2));
          console.log('latest.json platforms:', Object.keys(platforms).join(', '));
          NODE
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
