# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

# NO `paths-ignore`, AND THAT IS THE POINT OF THE GATE. A change touching only
# prose cannot break a lint — but a workflow that does not TRIGGER reports no
# check at all, and a required check that never reports does not pass the merge,
# it blocks it forever. `CI / Gate` is meant to be a required check, so this
# workflow has to run on every pull request, including a README-only one.

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0

  rust:
    name: Rust
    uses: kirchDev/workflows/.github/workflows/_ci-rust.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    with:
      working-directory: src-tauri
      platforms: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      system-dependencies: >-
        libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
        libxdo-dev libssl-dev build-essential file wget

  # NOT A BODY, and deliberately so: linking the Nuxt frontend into the Tauri
  # binary is what this repo ships, and no other repo in the estate does it.
  # `needs: rust` keeps the shape the copy had — the expensive 3-OS link never
  # starts unless fmt, clippy and the tests passed — and lets it restore the
  # cargo cache that job just wrote.
  tauri:
    name: Tauri build (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build (compile, no installers)
        run: pnpm tauri build --no-bundle
