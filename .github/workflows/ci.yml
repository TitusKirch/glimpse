# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

# NO `paths-ignore`, AND THAT IS THE POINT OF THE GATE. A change touching only
# prose cannot break a lint — but a workflow that does not TRIGGER reports no
# check at all, and a required check that never reports does not pass the merge,
# it blocks it forever. `CI / Gate` is meant to be a required check, so this
# workflow has to run on every pull request, including a README-only one.

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@4749430b355865343a7f70c111eeeb2e1f3e430b # v0.10.0

  # NO LONGER IN FRONT OF THE TAURI MATRIX — see `precheck` below for why, and
  # for what replaced it.
  #
  # `cache-shared-key` is what keeps this out of `_tauri-build.yml`'s cache. The
  # body's job is called `build`, and so is that one — and `rust-cache` keys on
  # the job id, so without a name of its own this repo's dev-profile checks and
  # its release-profile installers wrote into one family with incompatible
  # contents and evicted each other. Naming the family is the whole fix.
  rust:
    name: Rust
    uses: kirchDev/workflows/.github/workflows/_ci-rust.yml@4749430b355865343a7f70c111eeeb2e1f3e430b # v0.10.0
    with:
      working-directory: src-tauri
      # Shares the dev-profile family `precheck` writes, and keeps both out of
      # the release-profile one the Tauri legs use.
      cache-shared-key: rust-dev
      platforms: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      system-dependencies: >-
        libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
        libxdo-dev libssl-dev build-essential file wget

  # THE NARROWED FAIL-FAST GATE (#196). The Tauri matrix used to sit behind
  # `needs: rust`, which cost about nine minutes of wall clock on every green
  # run. Two reasons were given for it; only one survived measurement.
  #
  #   • "The Tauri job restores the cargo cache that job just wrote." FALSE, and
  #     the keys proved it: `Swatinem/rust-cache` keys on `github.job` unless
  #     `shared-key` is set, so `rust` wrote `v0-rust-build-…` and `tauri` read
  #     `v0-rust-tauri-…`. Two disjoint families that never met. Worse, they
  #     build different profiles — dev for clippy and tests, release for
  #     `tauri build` — so even a shared key would not share much.
  #   • "The expensive 3-OS link should not start unless the checks passed."
  #     TRUE, and kept — but it does not need the whole matrix to answer it.
  #     Nearly every red run is red on fmt or clippy, and one Linux runner
  #     settles that in a fraction of the time three platforms plus the tests
  #     take.
  #
  # So this job is the precondition instead, and `rust` now runs beside the
  # Tauri matrix rather than in front of it. This duplicates the fmt and clippy
  # that `rust`'s ubuntu leg also runs — deliberately, for the same reason the
  # central body already accepts duplicating `cargo fmt`: a cheap check on one
  # runner that unblocks an expensive one is worth running twice.
  #
  # NOT A REQUIRED CHECK, and it does not need to be. Anything that fails here
  # fails `rust`'s ubuntu leg too, which reports under `Rust / Gate`. This job
  # exists to gate the matrix below, not to add coverage.
  precheck:
    name: Rust precheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      # `rust-dev` is the DEV-PROFILE family: this job and, once
      # kirchDev/workflows#44 is released, `rust`'s matrix too. The command
      # below is the one that body runs, so the dependency graph they cache is
      # the same one and sharing the entry is exact rather than approximate.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: rust-dev

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # THE TAURI-FREE CLAIM, MEASURED (#103). `glimpse-core` carries the git
      # engine so the CLI can run it with no desktop anywhere in reach — a
      # promise that holds only as long as nothing drags Tauri back in, and one
      # nobody notices breaking, because the GUI build stays green either way.
      #
      # `cargo tree` is what settles it, and the whole *transitive* graph is the
      # point: the unit test in the crate reads its own manifest, which catches
      # a direct dependency and nothing else. A helper crate that innocently
      # depends on tauri would slip straight past it and be caught here.
      - name: Core crate is Tauri-free
        working-directory: src-tauri
        run: |
          tree=$(cargo tree --package glimpse-core --edges normal,build)
          if printf '%s\n' "$tree" | grep -q 'tauri'; then
            echo "::error::glimpse-core has Tauri in its dependency tree:"
            printf '%s\n' "$tree" | grep 'tauri'
            exit 1
          fi
          echo "glimpse-core is Tauri-free."

  # BUILT ONCE, NOT THREE TIMES (#196). `tauri build` runs `beforeBuildCommand`
  # — `pnpm generate` — inside every leg of the matrix below, and the result is
  # platform-independent: the same `.output/public` three times over. It is
  # built here and carried in as an artifact instead, and the legs run the Tauri
  # CLI with `beforeBuildCommand` overridden to nothing.
  #
  # Gated on `draft == false` to match the matrix it feeds — a draft that skips
  # the Tauri build has no use for the frontend either. `tauri-gate` needs this
  # job as well, so a frontend that fails to build cannot pass the merge button
  # by leaving the matrix skipped.
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      # HELD at v6.0.10 for the reason spelled out on the matrix job below.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: pnpm generate

      - name: Upload the frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: .output/public
          # Long enough to inspect a failed run, short enough not to accumulate.
          retention-days: 1
          # An empty upload here would leave the matrix below with nothing to
          # download — exactly the shape of #164, where a step returned 0 having
          # done nothing. Fail on the upload instead of three platforms later.
          if-no-files-found: error

  # NOT A BODY, and deliberately so: linking the Nuxt frontend into the Tauri
  # binary is what this repo ships, and no other repo in the estate does it.
  tauri:
    name: Tauri build (${{ matrix.os }})
    needs: [precheck, frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # HELD at v6.0.10 deliberately — do not bump without checking Windows.
      # v6.1.0 (d9184bf) leaves `pnpm` unrunnable on windows-latest: the shell
      # finds nothing to run, so `pnpm install` and `pnpm tauri build` each
      # return 0 in about a second having done nothing, and the job goes green
      # without building. `_tauri-build.yml` is on this same sha. Cause: #164;
      # #166 tracks lifting the hold once upstream ships a fix.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # `tauri-release` IS A DELIBERATE KEY, not a label (#196). Left unset,
      # `rust-cache` keys on `github.job`, and the estate's Rust jobs are called
      # `tauri` here, `build` in `_ci-rust.yml` and `build` in
      # `_tauri-build.yml` — so the release installers and the dev-profile
      # checks shared one family and overwrote each other, while this job sat in
      # a third family of its own. Every Windows leg logged `No cache found.`
      # Naming the family puts every RELEASE-profile build of this workspace —
      # this job and all three release chains — on one entry, and leaves the
      # dev-profile checks on `rust-dev`.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: tauri-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built once by `frontend` above, for all three platforms.
      - name: Download the frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: .output/public

      # #164 AGAIN, IN A NEW PLACE. `tauri build` no longer builds the frontend
      # itself, so a download that lands nothing would leave the CLI pointed at
      # an empty `frontendDist`. Say so here, in one line, rather than letting it
      # surface as something else three minutes into a Windows compile.
      - name: Verify the frontend bundle arrived
        shell: bash
        run: test -f .output/public/index.html

      # `beforeBuildCommand` is dropped on the command line rather than in
      # `src-tauri/tauri.conf.json`, because that file is also what a developer
      # builds with locally, and there `pnpm generate` must still run. `--config`
      # takes a merge patch over the file, so this changes one key for this
      # invocation only.
      #
      # `null` RATHER THAN `""`. The schema types the key as `HookCommand | null`
      # (`node_modules/@tauri-apps/cli/config.schema.json`), so null is a valid
      # value that deserialises to "no hook" — and under a merge-patch reading of
      # `--config`, null removes the key instead, which lands on the same place.
      # An empty string would rely on the CLI treating a blank script as absent,
      # which the schema does not promise.
      #
      # `shell: bash` so those JSON quotes mean the same thing on the Windows leg
      # as on the other two.
      - name: Tauri build (compile, no installers)
        shell: bash
        run: pnpm tauri build --no-bundle --config '{"build":{"beforeBuildCommand":null}}'

      # A Vue auto-import Nuxt decided not to inject leaves a bare `ref(` in the
      # bundle and throws only once that component renders — invisible to `pnpm
      # dev`, invisible to the unit tests, and fatal in the packaged app.
      # `.output/public` is on disk from the download above, so the scan is free.
      #
      # PLAIN `node` ON A `.ts` FILE, no loader and no devDependency: Node has
      # stripped types natively since 23.6, this repo pins `engines.node >= 24`,
      # and the setup-node above installs 24 on all three platforms. The price
      # is that the script must stay inside the erasable subset — no `enum`, no
      # `namespace`, no parameter properties — which is what the unit test in
      # `scripts/check-bundle-globals.test.ts` pins by running it exactly so.
      - name: Check the bundle for free Vue-API identifiers
        run: node scripts/check-bundle-globals.ts

  # THE ONE END-TO-END TEST, ON ONE PLATFORM (#159). It launches the built
  # binary through `tauri-driver` + `WebKitWebDriver` and drives the real UI, so
  # it is the only check in this workflow that proves the app BOOTS — the Tauri
  # matrix above proves it links, which is not the same claim.
  #
  # UBUNTU ONLY, and not as a compromise: `tauri-driver` has no macOS support at
  # all, on any version. Windows needs a matching `msedgedriver` and is a
  # deliberate follow-up.
  #
  # It reuses `frontend`'s bundle exactly as the matrix does, and builds
  # `--debug` rather than release: same code path, a fraction of the compile.
  e2e:
    name: E2E smoke test
    needs: [precheck, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    steps:
      # FULL HISTORY ON PURPOSE. The suite opens this checkout as the repository
      # under test and asserts the commit graph renders, so the clone it drives
      # has to look like a real one rather than a single grafted commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # HELD at v6.0.10 for the reason spelled out on the matrix job above.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `webkit2gtk-driver` is what provides `WebKitWebDriver`, and `xvfb` the
      # display the webview needs on a headless runner — neither is implied by
      # the build dependencies the other jobs install.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget \
            webkit2gtk-driver \
            xvfb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # `rust-dev` — the DEV-PROFILE family, shared with `precheck`: this job
      # builds the same workspace with the same profile, and `cache-bin` (on by
      # default) keeps the compiled `tauri-driver` below out of the critical
      # path on subsequent runs.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: rust-dev

      # Ships as a cargo binary, not an npm package, which is why it is not a
      # wdio service and not in the lockfile.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built once by `frontend` above, exactly as the Tauri matrix consumes it.
      - name: Download the frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: .output/public

      - name: Verify the frontend bundle arrived
        shell: bash
        run: test -f .output/public/index.html

      - name: Build the debug binary
        shell: bash
        run: pnpm tauri build --debug --no-bundle --config '{"build":{"beforeBuildCommand":null}}'

      # `dbus-run-session` as well as `xvfb-run`: the app registers a
      # single-instance guard and a `glimpse://` scheme over the session bus,
      # and a runner does not reliably have one.
      - name: Run the smoke test
        run: xvfb-run --auto-servernum dbus-run-session -- pnpm e2e

  # The one job above is what this repo actually ships, and nothing was
  # enforcing it: the required checks are `CI / Gate` and `Rust / Gate`, both
  # aggregators of the reusable workflows, and `tauri` sits outside both. A
  # Windows leg that silently built nothing therefore passed the merge button
  # unchallenged for two days (#164). This is the missing aggregator.
  #
  # `if: always()` is load-bearing, and so is treating `skipped` as a pass. The
  # matrix is gated on `draft == false`, so on a draft pull request it does not
  # run — and a required check that never reports blocks the merge forever
  # rather than passing it (the same reasoning as the missing `paths-ignore`
  # above). Reporting on every pull request, draft included, is what lets this
  # be required without stranding the drafts the AI work loop opens.
  # EVERY JOB THE MATRIX NEEDS IS LISTED HERE, and that is the rule rather than
  # a detail: a job the matrix merely `needs` reports nowhere itself, so when it
  # fails the matrix is SKIPPED — and skipped is a pass above. `frontend` and
  # `precheck` would each have taken the whole 3-OS build out of the gate while
  # leaving it green.
  #
  # `precheck` is the less obvious of the two. Its fmt and clippy are duplicated
  # by `_ci-rust.yml`'s ubuntu leg, so a CODE failure does surface under
  # `Rust / Gate` — but its apt step, its toolchain setup, its cache step and
  # its timeout have no such twin, and any of those failing removes the matrix
  # from the merge gate silently. That is the #165 shape, and listing the job is
  # the whole fix.
  #
  # `e2e` is here for the same rule read the other way round: it reports nowhere
  # else at all, so a red smoke test outside this list would be invisible to the
  # merge button rather than merely skipped.
  tauri-gate:
    name: Tauri Gate
    needs: [precheck, frontend, tauri, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check every job this gate covers
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A job this gate covers reported '$result'." && exit 1 ;;
            esac
          done
