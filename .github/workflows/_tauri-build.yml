# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Tauri Build

# The build half of both release chains, which were step-for-step identical.
#
# MEASURED, NOT ASSUMED: `release-beta.yml` and `release-experiment.yml` carried
# the same eight steps in the same order — apt dependencies, Rust, the cargo
# cache, pnpm install, the updater signing key from Bitwarden, the version stamp,
# Windows code signing, and tauri-action. Diffing the two jobs left exactly four
# differences: the job name, where the matrix comes from, one comment, and the
# `GLIMPSE_EXPERIMENT` variable. All four are inputs below.
#
# `release-stable.yml` joined later and needed one more — `ref` — because it can
# be asked to rebuild a tag that has already shipped.
#
# LOCAL RATHER THAN CENTRAL, deliberately. `kirchDev/workflows` holds what more
# than one repo needs, and this repo is the estate's only Tauri app — a central
# body here would be a bet on a second one that does not exist. `gildstone` draws
# the same line with its own `_test-*.yml`.
on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          JSON strategy matrix. A beta builds all three platforms; an experiment
          builds the subset its dispatch asked for.
        required: true
        type: string
      version:
        description: Version stamped into tauri.conf.json — tauri-action reads it from there.
        required: true
        type: string
      release-id:
        description: >-
          Numeric id of the release the installers are uploaded to — NOT its tag.
          Handed a tag, tauri-action looks the release up itself and then PATCHes
          the name and body of what it finds with this action's own inputs, so an
          unset `releaseBody` empties the release notes. An id skips that branch
          outright (`if (tagName && !releaseId)`) and only uploads assets. Every
          caller publishes its release before building, so the id always exists.
        required: true
        type: string
      job-name:
        description: Name shown per matrix leg.
        required: false
        type: string
        default: Build
      matrix-label:
        description: >-
          Which matrix key names the leg in the job title — `os` for a fixed
          three-platform build, `platform` for a computed subset.
        required: false
        type: string
        default: platform
      ref:
        description: >-
          Commit, branch or tag to build. Empty means the ref that triggered the
          run, which is what both release chains want. A REBUILD of an already
          shipped tag is the exception: the workflow definition has to come from
          the default branch (that is where `workflow_dispatch` can see it) while
          the SOURCE has to come from the tag, and only an explicit ref can pull
          those two apart.
        required: false
        type: string
        default: ''
      experiment-slug:
        description: >-
          Baked into the binary through `option_env!`, so the running app shows
          the experiment name in its sidebar. Empty for a beta, which has none.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Per-platform timeout — a cold Tauri build is slow.
        required: false
        type: number
        default: 45
    secrets:
      BWS_ACCESS_TOKEN:
        description: Bitwarden Secrets Manager access token — opens the updater signing key.
        required: true

jobs:
  # THE WSL COMMAND LINE, built once for every leg that needs it (#103).
  #
  # The Windows installer ships a native Linux `glimpse-cli` so the launcher it
  # drops into each WSL distro can run subcommands against that distro's own git
  # instead of forwarding them to glimpse.exe over the `\\wsl.localhost` share.
  # A Windows runner has no Linux linker, so the binary cannot be produced on the
  # leg that packages it — this job builds it and hands it over as an artifact.
  #
  # STATIC musl, not glibc. The payload runs inside whatever distro the user
  # happens to have; a glibc build carries the glibc of THIS runner and dies with
  # `GLIBC_2.xx not found` on anything older, which would make the native route
  # worse than the forwarding one it replaces.
  #
  # IT GATES ALL THREE LEGS, and that is the cost of not serialising the Windows
  # leg behind a whole Linux Tauri build. It is a single `cargo build` of a
  # four-dependency crate on a cached runner, measured in a couple of minutes
  # against a 45-minute budget. `fail-fast: false` below is about the matrix;
  # this job failing does stop the release, which is right — an installer with a
  # silently missing command line is the failure mode the guards exist to catch.
  wsl-payload:
    name: WSL command line (x86_64 musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl

      # rustup ships musl's libc, but not the linker that puts it together.
      - name: Install the musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: wsl-payload

      # Plain node, no pnpm install: the script imports nothing but node
      # builtins and a sibling script, so the dependency tree is not needed to
      # run it — and skipping it is most of this job's wall clock.
      - name: Build and stage the payload
        run: node scripts/build-wsl-payload.ts

      - name: Hand the payload to the Windows leg
        uses: actions/upload-artifact@v7
        with:
          name: glimpse-cli-linux-x86_64
          path: src-tauri/binaries/glimpse-cli-linux-x86_64
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ inputs.job-name }} (${{ matrix[inputs.matrix-label] }})
    needs: wsl-payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # tauri-action uploads the installers onto the release.
      contents: write
    strategy:
      # One platform failing must not cancel the others — knowing that only
      # Windows broke is the reason for building a matrix at all.
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Linux only: the macOS and Windows images carry what Tauri links against,
      # while a Linux image is minimal by design.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # NAMED, NOT INFERRED (#196). `rust-cache` falls back to `github.job` for
      # the key, and this job is called `build` — the same name `_ci-rust.yml`
      # gives its dev-profile checks. The two were writing into one
      # `v0-rust-build-…` family with incompatible profiles and evicting each
      # other, on an account already at its 10 GB cache limit — measured as
      # 6.0 GB under `v0-rust-build` and 4.5 GB under `v0-rust-tauri`, with the
      # Windows legs reporting `No cache found.` and compiling cold.
      # `tauri-release` puts every release-profile build of this workspace —
      # beta, experiment, stable, and CI's own `tauri` job — on one entry per
      # platform, and keeps them clear of the dev-profile one.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: tauri-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The updater signing key never becomes a GitHub secret — same runtime
      # pattern as the App PEMs elsewhere in the estate.
      - name: Fetch updater signing secrets from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            2fc619e7-4c67-4f40-9a63-b45b017af6d9 > TAURI_SIGNING_PRIVATE_KEY
            1fb62037-259b-45ec-b0fa-b45b017ab6e7 > TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      # tauri-action reads the version from tauri.conf.json rather than a flag,
      # so it has to be written into the file before the build.
      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' \
            src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

      # Authenticode-signs the Windows .exe and NSIS installer through Azure
      # Artifact Signing, by injecting bundle.windows.signCommand before the
      # build — see WINDOWS-SIGNING-SETUP.local.md.
      - name: Set up Windows code signing (Azure Artifact Signing)
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-codesigning
        with:
          bws-access-token: ${{ secrets.BWS_ACCESS_TOKEN }}

      # No latest.json here: `finalize` builds it once, so the parallel legs only
      # ever upload distinct files and cannot race each other.
      #
      # THE INPUT NAME IS LORE-BEARING. tauri-action v1 renamed this from
      # `includeUpdaterJson`, and an unknown input is a warning annotation, not
      # an error — the run stays green while the switch silently reverts to its
      # default. That is how the v0.13.0 rebuild had both legs write the shared
      # manifest anyway; only `finalize`'s `--clobber` afterwards hid it.
      # NO SIDECAR STEP HERE, and that is the difference from `ci.yml`. This
      # chain builds through `tauri build` with the hooks intact, so
      # `beforeBuildCommand` runs — `pnpm generate && pnpm cli:sidecar` — and
      # stages `binaries/glimpse-cli-<triple>` itself. `ci.yml` drops that hook
      # to reuse a prebuilt frontend, which is why it has to stage by hand.
      #
      # `--config` IS STILL REQUIRED (#103). `bundle.externalBin` is deliberately
      # NOT in `tauri.conf.json`: a declared sidecar is a build input that
      # `tauri-build` resolves on every compile, so keeping it there broke a bare
      # `cargo clippy`/`cargo test` on a clean checkout. It is switched on by the
      # fragment below, at the invocations that stage the file — and THIS is the
      # one that ships installers, so forgetting it here means a release whose
      # packages carry no command line at all.
      # Windows only: the Linux ELF the installer carries for WSL. It lands in
      # `binaries/` beside the sidecar because that directory is already the
      # staging area `tauri.conf.json`'s bundle paths are relative to — and the
      # payload's own +x bit is lost on NTFS, which costs nothing: the installer
      # inside the distro chmods after writing it.
      - name: Stage the WSL command line
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: glimpse-cli-linux-x86_64
          path: src-tauri/binaries

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GLIMPSE_EXPERIMENT: ${{ inputs.experiment-slug }}
        with:
          # ADDRESS THE RELEASE BY ID, NEVER BY TAG — see `release-id` above.
          # `releaseDraft` and `prerelease` are deliberately absent: both only
          # describe a release tauri-action would CREATE, and by id it creates
          # nothing. Every caller already publishes its own release.
          releaseId: ${{ inputs.release-id }}
          uploadUpdaterJson: false
          # TWO FRAGMENTS WOULD HAVE TO BE MERGED IN YAML, so there is one:
          # `tauri.wsl-payload.conf.json` re-declares the sidecar and adds the
          # WSL payload as a resource, and only the Windows leg — the only one
          # that stages the payload above — asks for it. Every other leg takes
          # the sidecar fragment unchanged. `build-wsl-payload.test.ts` pins the
          # superset against what it supersets, and pins this step against the
          # fragment, because forgetting either ships an installer with no
          # command line in it and says nothing.
          args: >-
            --config
            ${{ runner.os == 'Windows' && 'src-tauri/tauri.wsl-payload.conf.json'
            || 'src-tauri/tauri.sidecar.conf.json' }}
