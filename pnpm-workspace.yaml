# pnpm settings. Moved here from .npmrc: pnpm 10+ reads only auth/registry
# settings from .npmrc — every other setting must live in this file.

# Automatically install missing peer dependencies when possible.
autoInstallPeers: true

# Require packages to be at least 4320 minutes (3 days) old before install.
minimumReleaseAge: 4320

# Prefer using the lockfile as-is for deterministic installs.
preferFrozenLockfile: true

# Verify package integrity in the store before linking.
verifyStoreIntegrity: true

# Do not fail installs on peer dependency conflicts.
strictPeerDependencies: false

# Use pnpm's isolated node_modules linker layout.
nodeLinker: isolated

# pnpm settings. Native deps allowed to run install/build scripts
# (pnpm 11 reads this here, not from the package.json "pnpm" field).
allowBuilds:
  '@parcel/watcher': true
  # Denied on purpose. WebdriverIO pulls these in for browser automation, and
  # their install scripts download a Gecko/Edge driver binary over the network.
  # The e2e suite drives the Tauri app through `tauri-driver` + the platform
  # WebDriver (WebKitWebDriver on Linux), so neither is ever launched — letting
  # them run would add a network fetch to every install for nothing. They must
  # stay listed: pnpm fails the install on a build script it has no verdict for.
  edgedriver: false
  esbuild: true
  geckodriver: false
  vue-demi: true
