[package]
name = "glimpse"
version = "0.0.0"
description = "Lightweight, git-native desktop Git client"
authors = ["Titus Kirch <titus.kirch@kirch.dev>"]
license = "MIT"
repository = "https://github.com/TitusKirch/glimpse"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glimpse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
ts-rs = "11"
