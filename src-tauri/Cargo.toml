[package]
name = "glimpse"
version = "0.4.0"
description = "A lightweight, git-native desktop Git client — the full branch graph, diffs, and everyday git, with first-class WSL support."
authors = ["Titus Kirch <titus.kirch@kirch.dev>"]
license = "MIT"
repository = "https://github.com/TitusKirch/glimpse"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glimpse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
notify = "8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# `glimpse <path>` CLI entry: single-instance funnels a second launch into the
# running window; cli parses the path argument on first launch. Desktop-only —
# there is no terminal entry point on mobile.
tauri-plugin-single-instance = "2"
tauri-plugin-cli = "2"
notify-debouncer-mini = "0.7"
ts-rs = "11"
semver = "1"
