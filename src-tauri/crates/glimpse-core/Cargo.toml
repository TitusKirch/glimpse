# The git engine, with NO Tauri anywhere in its dependency tree — that is the
# crate's whole reason to exist, and `core_declares_no_tauri_dependency` plus the
# `cargo tree` step in CI are what hold the line. Anything that needs a window,
# an app handle or an IPC command belongs in the `glimpse` GUI package instead.
[package]
name = "glimpse-core"
# Literal, and bumped in lockstep by release-please — see the note in the
# workspace root's Cargo.toml for why it is not inherited.
version = "0.13.0"
description = "glimpse's git engine: shell-out git, platform resolution and the changelist model — free of any GUI toolkit."
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
